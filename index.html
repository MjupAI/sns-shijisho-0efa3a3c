<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>SNS投稿のつくり方</title>
<style>
:root{--bg:#f4f7fc;--card:#fff;--ink:#17233d;--sub:#566380;--line:#dde4f2;--brand:#2f6df0;--brand-d:#2456c8;--ok:#16a34a;--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header.top{background:linear-gradient(135deg,#e1306c,#f77737);color:#fff;padding:28px 0 58px}
header.top .wrap{padding-bottom:0}
header.top .eyebrow{font-size:13px;letter-spacing:.12em;opacity:.9}
header.top h1{margin:4px 0 6px;font-size:28px}
header.top p{margin:0;opacity:.95;font-size:15px}
main{margin-top:-34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 2px 10px rgba(30,50,100,.06)}
.stack>*+*{margin-top:18px}
h2{font-size:21px;margin:0 0 10px}
.small{font-size:14px;color:var(--sub)}
.flowbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.flowbar div{background:#fff3ea;border:1px solid #ffd9bf;border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px;text-align:center}
@media(max-width:600px){.flowbar{grid-template-columns:1fr}}
table.items{border-collapse:collapse;width:100%;margin-top:6px}table.items td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;font-size:15.5px}table.items td:first-child{background:#f5f8ff;font-weight:700;width:34%}
.warn{background:#fff7de;border-left:6px solid #f0b429;border-radius:10px;padding:10px 14px;font-size:15.5px;margin-top:12px}
.okbox{background:#eaf8ef;border-left:6px solid var(--ok);border-radius:10px;padding:8px 14px;font-size:15.5px;margin-top:10px}
.okbox b{color:#116b35}
nav.tabs{position:sticky;top:0;z-index:5;background:rgba(244,247,252,.95);backdrop-filter:blur(6px);padding:10px 16px;margin:0 -16px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs a{flex:none;min-height:44px;display:inline-flex;align-items:center;padding:4px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15.5px;font-weight:700}
nav.tabs a.on{background:var(--brand);border-color:var(--brand);color:#fff}
.bar{height:10px;background:#e3e9f6;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.step{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px;background:#fff}
.step.done{background:#f1faf4;border-color:#b6e4c6}
.step header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.step.done .num{background:var(--ok)}
.step h3{margin:0;font-size:18px;flex:1 1 200px}
label.ok{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 6px;font-size:15px;font-weight:700;cursor:pointer;color:var(--sub)}
label.ok input{width:24px;height:24px;accent-color:var(--ok)}
.body{margin:6px 0 0 50px}@media(max-width:560px){.body{margin-left:0}}
.body p{margin:6px 0}
.shot{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:zoom-in}
.cap{font-size:13.5px;color:var(--sub);margin:-2px 0 6px}
.copybox{border:1.5px solid #cfd9f2;border-radius:12px;background:#f7f9ff;margin:10px 0;overflow:hidden}
.copybox .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eaf0ff;padding:6px 10px 6px 14px;font-weight:700;font-size:14.5px;color:var(--brand-d)}
.copybox pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:16px;line-height:1.7}
.copybox pre mark{background:#ffe98a;border-radius:4px;padding:0 3px}
.copy{flex:none;min-height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--brand);background:#fff;color:var(--brand-d);font-weight:800;font-size:14.5px;cursor:pointer}
.copy.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chk{display:flex;align-items:flex-start;gap:10px;min-height:44px;margin:6px 0;font-size:16.5px}
.chk input{width:24px;height:24px;margin-top:4px;accent-color:var(--ok)}
table.help{border-collapse:collapse;width:100%}table.help td{border:1px solid var(--line);padding:10px 12px;vertical-align:top}table.help td:first-child{background:#fff7de;font-weight:700;width:42%}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;text-decoration:none}
#lb{position:fixed;inset:0;background:rgba(15,23,42,.88);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;cursor:zoom-out}#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:10px;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#17233d;color:#fff;padding:10px 20px;border-radius:99px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:30}.toast.on{opacity:1;transform:translate(-50%,0)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #ffb000;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{header.top,nav.tabs,.toast,.copy{display:none}body{background:#fff}.card,.step{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="eyebrow">ESPICT SCHOOL</div><h1>SNS投稿のつくり方</h1><p>シートから情報を選ぶ → ChatGPTで投稿文と画像を作る → Instagramに投稿する</p></div></header>
<main class="wrap">
<section class="card" id="overview"></section>
<nav class="tabs" id="tabs" aria-label="手順の切り替え"></nav>
<div id="view" class="stack" style="margin-top:16px"></div>
</main>
<div id="lb" role="dialog" aria-label="画像の拡大"><img alt=""></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let store={};try{store=JSON.parse(localStorage.getItem('sns-shijisho')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('sns-shijisho',JSON.stringify(store))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1400)};
const copyText=async t=>{try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e2){return false}}};
const hl=t=>esc(t).replace(/(［[^］]*］)/g,'<mark>$1</mark>');
const copybox=c=>`<div class="copybox"><div class="hd"><span>${esc(c.label)}</span><button class="copy" data-copy="${esc(c.text)}">コピー</button></div><pre>${hl(c.text)}</pre></div>`;
function overview(){
 const o=OVERVIEW;
 $('#overview').innerHTML=`<h2>この作業について</h2>
 <p style="margin:0 0 6px"><b>目的：</b>${esc(o.purpose)}</p>
 <p style="margin:0 0 10px"><b>時間：</b>${esc(o.time)}</p>
 <div class="flowbar"><div>① 最初に1回だけ<br><span class="small">アカウントと固定3投稿</span></div><div>② 1投稿ごと<br><span class="small">17のステップ</span></div><div>③ 提出<br><span class="small">投稿のリンク</span></div></div>
 <h2 style="margin-top:18px;font-size:18px">準備するもの</h2>
 <table class="items">${o.items.map(i=>`<tr><td>${esc(i[0])}</td><td>${esc(i[1])}</td></tr>`).join('')}</table>
 <div class="warn">⚠️ ${esc(o.warn)}</div>
 <h2 style="margin-top:18px;font-size:18px">納品先と、提出のきまり</h2>
 <p style="margin:0 0 6px"><b>納品先：</b>${esc(o.submit.to)}</p>
 <p style="margin:0 0 6px"><b>提出するもの：</b>${esc(o.submit.what)}</p>
 ${copybox({label:'提出の書き方（5つ）',text:o.submit.text})}
 <p class="small" style="margin:0">${esc(o.submit.note)}</p>
 <p class="small" style="margin:10px 0 0">${esc(o.relation)}</p>`;
}
const key=(p,i)=>`${p}.${i}`;
const prog=p=>{const ph=PHASES.find(x=>x.key===p);let d=0;ph.steps.forEach((_,i)=>{if(store[key(p,i)])d++});return[d,ph.steps.length]};
function stepHTML(p,s,i){
 const k=key(p,i),d=!!store[k];
 const imgs=[s.img,...(s.imgs||[])].filter(Boolean);
 return`<section class="step${d?' done':''}" id="st-${p}-${i}"><header><span class="num">${d?'✓':i+1}</span><h3>${esc(s.t)}</h3><label class="ok"><input type="checkbox" data-k="${k}" ${d?'checked':''}>できた</label></header><div class="body">
 ${(s.p||[]).map(x=>`<p>${esc(x)}</p>`).join('')}
 ${s.copy?(Array.isArray(s.copy)?s.copy:[s.copy]).map(copybox).join(''):''}
 ${imgs.map(m=>`<img class="shot" src="img/${m}" alt="${esc(s.t)}の画面" loading="lazy">`).join('')}
 ${s.imgcap?`<div class="cap">${esc(s.imgcap)}</div>`:''}
 ${s.checks?s.checks.map((c,n)=>`<label class="chk"><input type="checkbox" data-k="${k}.c${n}" ${store[k+'.c'+n]?'checked':''}><span>${esc(c)}</span></label>`).join(''):''}
 ${s.warn?`<div class="warn">⚠️ <b>注意</b>　${esc(s.warn)}</div>`:''}
 ${s.ok?`<div class="okbox"><b>✅ こうなればOK</b>　${esc(s.ok)}</div>`:''}
 </div></section>`}
function view(){
 const h=location.hash.replace(/^#\/?/,'')||'first';
 const tabs=[...PHASES.map(p=>({k:p.key,l:p.label})),{k:'help',l:'困ったとき'}];
 $('#tabs').innerHTML=tabs.map(t=>`<a href="#/${t.k}" class="${t.k===h?'on':''}">${t.l}</a>`).join('');
 const v=$('#view');
 if(h==='help'){v.innerHTML=`<section class="card"><h2>困ったとき</h2><table class="help">${HELP.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table></section>`;return}
 const ph=PHASES.find(p=>p.key===h)||PHASES[0];const[d,t]=prog(ph.key);
 v.innerHTML=`<section class="card"><h2 style="margin-bottom:4px">${esc(ph.title)}</h2><div class="small">${esc(ph.note)}</div><div style="margin-top:12px"><div class="bar"><i id="bar" style="width:${d/t*100}%"></i></div><div class="small" id="barlab" style="margin-top:6px">${d} / ${t} できた</div></div></section>`+ph.steps.map((s,i)=>stepHTML(ph.key,s,i)).join('')+(ph.key==='first'?`<p style="text-align:center;margin:20px 0 0"><a class="btn" href="#/each">次へ：1投稿ごとの作業 →</a></p>`:`<p style="text-align:center;margin:20px 0 0"><a class="btn" href="#/help">困ったとき →</a></p>`);
 v.querySelectorAll('input[data-k]').forEach(el=>el.addEventListener('change',()=>{store[el.dataset.k]=el.checked?1:0;save();if(!el.dataset.k.includes('.c')){const sec=el.closest('.step');sec.classList.toggle('done',el.checked);$('.num',sec).textContent=el.checked?'✓':(+sec.id.split('-').pop()+1);const[d2,t2]=prog(ph.key);$('#bar').style.width=(d2/t2*100)+'%';$('#barlab').textContent=`${d2} / ${t2} できた`}}));
}
document.addEventListener('click',async e=>{
 const si=e.target.closest('img.shot');if(si){const lb=$('#lb');$('img',lb).src=si.src;lb.classList.add('on');return}
 if(e.target.closest('#lb')){$('#lb').classList.remove('on');return}
 const b=e.target.closest('.copy');if(!b)return;const ok=await copyText(b.dataset.copy);
 if(ok){b.classList.add('ok');b.textContent='コピーした';toast('コピーしました');setTimeout(()=>{b.classList.remove('ok');b.textContent='コピー'},1400)}else toast('コピーできませんでした。文を選んで、手でコピーしてください')});
addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});
addEventListener('hashchange',()=>{view();scrollTo(0,0)});
overview();view();
</script>
</body></html>
